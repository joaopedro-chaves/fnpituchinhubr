name: Lançar Elementais

on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'IDs dos elementais (separados por vírgula). Aceita curinga: bush_*, *_tricktreat'
        required: true
        type: string
      action:
        description: 'Ação a executar'
        required: true
        default: release
        type: choice
        options:
          - release
          - unrelease
      dry_run:
        description: 'Apenas simular (não faz commit)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-sprites
  cancel-in-progress: false

jobs:
  release:
    name: Atualizar estado dos elementais
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Atualizar sprites-data.js
        id: update
        env:
          INPUT_IDS: ${{ inputs.ids }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--ids "$INPUT_IDS" --action "$INPUT_ACTION")
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          node scripts/release-sprites.js "${ARGS[@]}"

      - name: Validar sintaxe do arquivo
        run: node --check src/data/sprites-data.js

      - name: Commit e push
        if: ${{ !inputs.dry_run && steps.update.outputs.changed_count != '0' }}
        env:
          INPUT_ACTION: ${{ inputs.action }}
          CHANGED_IDS: ${{ steps.update.outputs.changed_ids }}
          CHANGED_COUNT: ${{ steps.update.outputs.changed_count }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- src/data/sprites-data.js; then
            echo "Nenhuma alteração para commitar."
            exit 0
          fi

          if [ "$INPUT_ACTION" = "release" ]; then
            TITLE="feat: lançar $CHANGED_COUNT elemental(is)"
          else
            TITLE="chore: marcar $CHANGED_COUNT elemental(is) como não lançado(s)"
          fi

          git add src/data/sprites-data.js
          git commit -m "$TITLE" -m "IDs: ${CHANGED_IDS//,/, }"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
