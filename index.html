<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Rastreie, gerencie e compartilhe sua coleção de pituchinhos do Fortnite e seu progresso de dominação.">
    <title>Rastreador de pituchinhos</title>
    <link rel="icon" type="image/webp" href="favicon.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        rel="preload"
        as="style"
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap">
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet"
        media="print"
        onload="this.media='all'">
    <noscript>
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet">
    </noscript>
    <meta name="theme-color" content="#141218" />
    <link rel="apple-touch-icon" href="pwa-192x192.png" />
    <script>
        try {
            if (localStorage.getItem('fn_state_light_theme') === 'true') {
                document.documentElement.dataset.theme = 'light';
                document.documentElement.style.colorScheme = 'light';
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', '#FEF7FF');
            }
        } catch {}
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
