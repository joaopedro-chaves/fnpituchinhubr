<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Lista completa de códigos de trapaça e recompensas do Fortnite Rastreador de Pituchinhos. Copie e gerencie seus códigos com facilidade.">
    <title>Rastreador de Pituchinhos - Códigos de Trapaça</title>
    <link rel="icon" type="image/png" href="siteimages/staticsprite.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="src/data/codes-data.js" defer></script> <!-- Data Codes -->
    <script type="module" src="src/data/codes-app.js"></script> <!-- App functions -->
</head>

<body>

    <div class="app">
        <header class="header">
            <div class="brand">
                <h1>Códigos e Trapaças</h1>
            </div>
            <div class="actions" style="grid-template-columns: repeat(1, minmax(0, 1fr));">
                <a href="index.html" class="btn btn-accent">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"
                        style="margin-right: 6px;">
                        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                    </svg>
                    Voltar
                </a>
                <div class="codes-progress-badge" id="codesProgressBadge">0 / 0 resgatados</div>
            </div>
        </header>

        <nav class="toolbar codes-toolbar">
            <div class="toolbar-row">
                <label class="sr-only" for="codeSearchInput">Buscar código ou recompensa</label>
                <input type="search" id="codeSearchInput" class="input codes-search-input"
                    placeholder="Buscar código ou recompensa…" autocomplete="off" spellcheck="false">
                <div class="switches">
                    <label class="switch">
                        <input type="checkbox" id="hideRedeemedToggle" checked>
                        <span>Ocultar resgatados</span>
                    </label>
                </div>
            </div>
        </nav>

        <main class="codes-main-container">
            <div class="codes-info-banner">
                <svg class="codes-info-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"
                    aria-hidden="true">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
                </svg>
                <span>Clique em um código ou no botão <strong>Copiar</strong> para copiá-lo para a área de
                    transferência.</span>
            </div>
            <div class="codes-list" id="codesList">
                <!-- Codes rendered via JavaScript -->
            </div>
        </main>
        <footer class="footer">
            <p>Fortnite and its materials (Sprites and Data) are trademarks and copyrights of Epic Games, Inc. This
                website is not endorsed or affiliated with Epic Games, Inc..</p>
        </footer>
    </div>

</body>

</html>
